[build-system]
requires = ["hatchling>=1.27", "wheel"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zdi"]

[project]
name = "zdi-usb-probe-cli"
version = "0.1.0"
description = "ZDI USB Probe Command Line Interface"
readme = "README.md"
authors = [{ name = "DigitalVS", email = "vitomir.spasojevic@gmail.com" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["ZDI", "zilog debugging interface", "ez80"]
dependencies = [
    "pyserial==3.5",
    "pyparsing==3.1.2",
    "bitarray==2.9.2",
    "tabulate==0.9.0",
    "progress==1.6",
    "tqdm==4.66.2",
]
requires-python = ">=3.9"

[project.scripts]
zdi = "zdi.args_read:main"

[project.urls]
Homepage = "https://github.com/DigitalVS/ZDI-USB-Probe"

[tool.bumpver]
current_version = "0.1.0"
version_pattern = "MAJOR.MINOR.PATCH[-TAG]"
commit_message = "Bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"',
]
"src/zdi/args_read.py" = [
    'VERSION = "{version}"',
]