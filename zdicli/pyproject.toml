[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zdi-usb-probe-cli"
version = "0.1.0"
description = "ZDI USB Probe Command Line Interface"
readme = "README.md"
authors = [{ name = "DigitalVS", email = "vitomir.spasojevic@gmail.com" }]
#license = { file = "LICENSE" }
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["zdi", "ez80", "debugging"]
dependencies = [
    "pyserial==3.5",
    "pyparsing==3.1.2",
    "bitarray==2.9.2",
    "tabulate==0.9.0",
    "progress==1.6",
    "tqdm==4.66.2",
]
requires-python = ">=3.9"

[project.scripts]
zdi = "zdi.args_read:main"

[project.urls]
Homepage = "https://github.com/DigitalVS/ZDI-USB-Probe"

[tool.bumpver]
current_version = "0.1.0"
version_pattern = "MAJOR.MINOR.PATCH[-TAG]"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"',
]
"src/zdi/args_read.py" = [
    'VERSION = "{version}"',
]

[tool.black]
include = '\.pyi?$'
exclude = '''
    /(
        \.git
      | \.venv
      | venv
      | _build
      | build
      | dist
    )/
    '''
    
[tool.pytest.ini_options]
pythonpath = [
  "src"
]